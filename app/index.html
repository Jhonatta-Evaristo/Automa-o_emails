<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GCF — Envio de Documentos</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#142742;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#0b2143;color:white;padding:20px max(24px,calc((100vw - 950px)/2));border-bottom:5px solid #049de9}header strong{font-size:23px}header .brand{display:flex;align-items:center;gap:12px}header img{width:64px;height:64px;object-fit:contain;border-radius:12px;background:white}header small{display:block;color:#b9d5ef;margin-top:5px}.wrap{max-width:950px;margin:32px auto;padding:0 18px}h1{font-size:25px;margin:0 0 23px}.card{background:white;border:1px solid #e2e9f2;border-radius:16px;padding:28px;box-shadow:0 5px 22px #14345610}label{display:block;font-weight:700;margin:15px 0 8px}input,select{width:100%;padding:14px;border:1px solid #b7c9dd;border-radius:9px;font-size:15px;background:#fff;color:#172b45}input:focus,select:focus{outline:2px solid #009dea}.radios{display:flex;gap:18px;flex-wrap:wrap}.radio{padding:12px 17px;border-radius:9px;background:#f2f8fd;font-weight:500;cursor:pointer}.radio input{width:auto;accent-color:#048fea}.upload{border:2px dashed #58aff1;padding:25px;text-align:center;border-radius:10px;background:#f5fbff}button{border:0;border-radius:9px;padding:14px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#068ee4;color:white}button:disabled{background:#cbd6e1;color:#728194;cursor:not-allowed}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.result{display:none;margin-top:22px;padding:18px;border-radius:10px;background:#f5f8fb;border:1px solid #d3dce9}.result.ok{display:block;background:#eaf9f0;border-color:#9bd4af}.result.bad{display:block;background:#fff1f1;border-color:#e4a6a6}.result p{margin:8px 0}.result ul{margin:10px 0 0;padding-left:19px}footer{margin-top:20px;color:#748398;font-size:12px;text-align:center}@media(max-width:600px){.card{padding:18px}.actions button{width:100%}header{padding:19px}}
</style></head><body><header><div class="brand"><img src="/logo.png" alt="Logo Grupo Conceito Fiscal"><div><strong>GRUPO CONCEITO FISCAL</strong><small>Validação e envio de documentos</small></div></div></header><main class="wrap"><h1>Envio de documentos</h1><div class="card"><form id="form"><label for="email">E-mail da empresa</label><input id="email" type="email" autocomplete="off" required placeholder="contato@empresa.com.br"><label>Categoria</label><div class="radios"><label class="radio"><input type="radio" name="cat" value="simples" checked> Simples Nacional</label><label class="radio"><input type="radio" name="cat" value="normal"> Lucro Normal</label></div><label for="kind">Tipo de documento</label><select id="kind" required></select><label for="pdf">Anexar documento (PDF)</label><div class="upload"><input type="file" id="pdf" accept="application/pdf,.pdf" required><small>Máximo 12 MB • o arquivo é analisado antes de ser enviado</small></div><div class="actions"><button id="validate" type="submit">Validar documento</button><button id="send" type="button" disabled>Enviar e-mail</button></div></form><section id="result" class="result" role="status" aria-live="polite"></section></div><footer>Uso interno GCF • Nenhum documento é enviado antes da validação</footer></main><script>
const types={simples:[['declaracao','Declaração Simples Nacional'],['extrato','Extrato Simples Nacional'],['das','Guia DAS Simples Nacional'],['recibo_simples','Recibo Simples Nacional']],normal:[['dare','Guia DARE'],['sped_contrib','Recibo SPED Contribuições'],['sped_fiscal','Recibo SPED Fiscal']]};
const $=id=>document.getElementById(id);let token=null;let revision=0;const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clear(){revision++;token=null;$('send').disabled=true;$('result').className='result';$('result').textContent='';}
function category(){return document.querySelector('[name=cat]:checked').value}
function refill(){let sel=$('kind');sel.innerHTML='';for(let [key,label] of types[category()]){let o=document.createElement('option');o.value=key;o.textContent=label;sel.append(o)}clear()}
document.querySelectorAll('[name=cat]').forEach(e=>e.addEventListener('change',refill));['email','kind','pdf'].forEach(id=>$(id).addEventListener('change',clear));$('email').addEventListener('input',clear);refill();
$('form').addEventListener('submit',async ev=>{ev.preventDefault();clear();const submittedRevision=revision;let btn=$('validate');btn.disabled=true;btn.textContent='Validando...';try{let fd=new FormData();fd.append('email',$('email').value);fd.append('category',category());fd.append('kind',$('kind').value);fd.append('document',$('pdf').files[0]);let res=await fetch('/api/validate',{method:'POST',body:fd});let data=await res.json();if(submittedRevision!==revision)return;if(!res.ok)throw Error(data.detail||'Erro de validação');let html=`<strong>${data.approved?'✓ Documento aprovado':'✕ Envio bloqueado'}</strong><p>Tipo identificado: ${escapeHtml(data.detected_label||'Não identificado')}</p><p>Categoria: ${escapeHtml(data.category_label||'Não identificada')}</p><p>CNPJ: ${escapeHtml(data.cnpj||'Não identificado')}</p><p>Competência: ${escapeHtml(data.competence||'Não identificada')}</p>`;if(data.reasons?.length)html+=`<ul>${data.reasons.map(r=>'<li>'+escapeHtml(r)+'</li>').join('')}</ul>`;$('result').innerHTML=html;$('result').className='result '+(data.approved?'ok':'bad');if(data.approved && data.token){token=data.token;$('send').disabled=false}else if(data.approved){$('result').insertAdjacentHTML('beforeend','<p><small>Validação aprovada. O envio por e-mail está desativado nesta demonstração.</small></p>')}}catch(e){if(submittedRevision===revision){$('result').className='result bad';$('result').textContent='Erro: '+e.message}}finally{btn.disabled=false;btn.textContent='Validar documento'}});
$('send').addEventListener('click',async()=>{if(!token)return;let current=token;token=null;$('send').disabled=true;$('result').textContent='Solicitando envio ao servidor...';try{let res=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:current})});let data=await res.json();if(!res.ok)throw Error(data.detail||'Envio não confirmado');$('result').className='result ok';$('result').textContent=data.message}catch(e){$('result').className='result bad';$('result').textContent='Envio não confirmado: '+e.message+'. Valide novamente antes de nova tentativa.'}});
</script></body></html>
